# Standalone Rust CLI binaries only; minor constraints, patches via mise upgrade.
# No global lock requirement or managed mise.lock. Projects choose their own policy.
# Nix owns application dependencies, shell integrations, editors and Yazi.
# Rust toolchains remain rustup-owned; Nix also retains Tokei/Eza.
[settings]
auto_install = false
exec_auto_install = false
not_found_auto_install = false
aqua.cosign = true
aqua.github_attestations = true
aqua.minisign = true
aqua.slsa = true
disable_backends = ["cargo", "asdf"]

[tools]
"aqua:ducaale/xh" = "0.26"
"aqua:chmln/sd" = "1.1"
"github:bootandy/dust" = "1.2"
"aqua:bensadeh/tailspin" = "7.0"
"aqua:sharkdp/hexyl" = "0.17"
"github:dalance/procs" = "0.14"
"github:sharkdp/hyperfine" = "2.0"
"github:hatoo/oha" = "1.16"
"github:pemistahl/grex" = "1.4"
"aqua:ast-grep/ast-grep" = "0.45"
"github:Wilfred/difftastic" = "0.71"
"aqua:crate-ci/typos" = "1.51"
"aqua:orhun/git-cliff" = "2.14"
"aqua:watchexec/watchexec" = "2.8"
"aqua:jdx/usage" = "6.12"
"github:ouch-org/ouch" = "0.8"
"github:astral-sh/uv" = "0.12"
"github:astral-sh/ruff" = "0.16"
"github:astral-sh/ty" = "0.0"

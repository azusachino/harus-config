# Upstream release binaries only. Review exact pins and mise.lock together.
# Rust toolchains remain rustup-owned; language runtime defaults remain in Nix.
[settings]
# Require reviewed platform URLs and digests; never install on a shell lookup.
locked = true
auto_install = false
exec_auto_install = false
not_found_auto_install = false
locked_verify_provenance = true
# Do not automatically trust every repository under Projects/Working.
aqua.cosign = true
aqua.github_attestations = true
aqua.minisign = true
aqua.slsa = true
# Prevent registry/Git Cargo installs bypassing the binary-only manifest.
disable_backends = ["cargo", "asdf"]


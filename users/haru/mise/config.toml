# Rust CLI release binaries, pinned to minor versions; patches via mise upgrade.
# No global lock requirement or managed mise.lock. Projects choose their own policy.
# Rust toolchains remain rustup-owned; Nix retains Tokei/Eza and Starship.
[settings]
auto_install = false
exec_auto_install = false
not_found_auto_install = false
aqua.cosign = true
aqua.github_attestations = true
aqua.minisign = true
aqua.slsa = true
disable_backends = ["cargo", "asdf"]

[tools]
"aqua:ducaale/xh" = "0.26"
"aqua:sharkdp/fd" = "10.5"
